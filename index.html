<<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Gastos Diarios</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    body {
      background: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
    }
    .btn-custom {
      background-color: #00b894;
      color: white;
    }
    .btn-custom:hover {
      background-color: #019875;
    }
    .gasto-item {
      transition: transform 0.2s ease;
    }
    .gasto-item:hover {
      transform: scale(1.02);
    }
    .total-box {
      font-size: 1.3rem;
      font-weight: bold;
      color: #2d3436;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4 bg-white">
          <h2 class="text-center mb-4 text-primary animate__animated animate__fadeInDown">Calculadora de Gastos Diarios</h2>

          <!-- Formulario -->
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <input id="concepto" type="text" class="form-control" placeholder="Concepto (ej. comida)" />
            </div>
            <div class="col-md-4">
              <input id="monto" type="number" class="form-control" placeholder="Monto" />
            </div>
            <div class="col-md-2 d-grid">
              <button onclick="agregarGasto()" class="btn btn-custom">Agregar</button>
            </div>
          </div>

          <!-- Lista de gastos -->
          <ul id="lista-gastos" class="list-group mb-3"></ul>

          <!-- Total -->
          <div class="text-end total-box">
            Total Gastado: $<span id="total">0.00</span>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const listaGastos = document.getElementById('lista-gastos');
    const totalSpan = document.getElementById('total');
    let total = 0;

    function agregarGasto() {
      const concepto = document.getElementById('concepto').value.trim();
      const monto = parseFloat(document.getElementById('monto').value);

      if (concepto === '' || isNaN(monto) || monto <= 0) {
        alert('Por favor, introduce un concepto y un monto válido.');
        return;
      }

      // Crear elemento
      const li = document.createElement('li');
      li.className = 'list-group-item d-flex justify-content-between align-items-center gasto-item animate__animated animate__fadeInUp';
      li.innerHTML = `
        <span>${concepto}</span>
        <span class="badge bg-success rounded-pill">$${monto.toFixed(2)}</span>
      `;

      // Agregar a la lista
      listaGastos.appendChild(li);

      // Actualizar total
      total += monto;
      totalSpan.textContent = total.toFixed(2);

      // Limpiar inputs
      document.getElementById('concepto').value = '';
      document.getElementById('monto').value = '';
      document.getElementById('concepto').focus();
    }
  </script>

</body>
</html>
